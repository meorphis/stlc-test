# yaml-language-server: $schema=https://app.stainless.com/config.schema.json

# The main edition for the config, see the [docs] for more information.
#
# [docs]: https://www.stainless.com/docs/reference/editions
edition: 2025-10-10

organization:
  name: meorphis-test-5
  docs: https://docs.meorphis-test-1.com
  contact: support@acme.com

# `targets` define the output targets and their customization options, such as
# whether to emit the Node SDK and what its package name should be.
targets:
  typescript:
    # The edition for this target, see the [docs] for more information.
    #
    # [docs]: https://www.stainless.com/docs/reference/editions
    edition: typescript.2025-10-10
    package_name: incident-io-2
    staging_repo: meorphis/stlc-typescript-test
    production_repo: null
    publish:
      npm: false

resources:
  accounts:
    methods:
      retrieve: get /accounts/{account_token}
      update: patch /accounts/{account_token}
    subresources:
      credit_configuration:
        methods:
          retrieve: get /accounts/{account_token}/credit_configuration
          update: patch /accounts/{account_token}/credit_configuration
        models:
          businessAccount: BusinessAccount
    models:
      accountConfiguration: AccountConfiguration
  cards:
    methods:
      create: post /cards
      retrieve: get /cards/{card_token}
      update: patch /cards/{card_token}
      provision: post /cards/{card_token}/provision
    subresources:
      financial_transactions:
        methods:
          retrieve: >-
            get
            /cards/{card_token}/financial_transactions/{financial_transaction_token}
        models:
          financialTransaction: FinancialTransaction
    models:
      card: Card
  status:
    methods:
      retrieve: get /status
settings:
  license: Apache-2.0
client_settings:
  opts:
    api_key:
      type: string
      auth:
        security_scheme: ApiKeyAuth
      read_env: MEORPHIS_TEST_1_API_KEY
environments:
  production: https://api.acme.com/v1
  environment_1: https://sandbox.acme.com/v1
query_settings:
  nested_format: brackets
  array_format: comma
readme:
  example_requests:
    default:
      type: request
      endpoint: get /status
      params: &ref_0 {}
    headline:
      type: request
      endpoint: get /status
      params: *ref_0